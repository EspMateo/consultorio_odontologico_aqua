<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultorio Odontológico AQUA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1565c0 0%, #0288d1 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      color: white;
      user-select: none;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.75;
      margin-bottom: 52px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      opacity: 0.65;
      height: 18px;
      transition: opacity 0.3s;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo">🦷</div>
  <h1>Consultorio Odontológico AQUA</h1>
  <p class="subtitle">Sistema de gestión dental</p>
  <div class="spinner"></div>
  <p class="status" id="status">Iniciando sistema...</p>

  <script>
    const messages = [
      'Iniciando sistema...',
      'Cargando base de datos...',
      'Preparando servicios...',
      'Iniciando servidor...',
      'Casi listo...'
    ];
    let i = 0;
    const el = document.getElementById('status');
    setInterval(() => {
      el.style.opacity = '0';
      setTimeout(() => {
        i = (i + 1) % messages.length;
        el.textContent = messages[i];
        el.style.opacity = '0.65';
      }, 300);
    }, 3000);
  </script>
</body>
</html>

spring.application.name=consultorio_aqua

# H2 embedded database - persists to user home directory
# File stored at: C:\Users\{user}\.consultorioAqua\db.mv.db
spring.datasource.url=jdbc:h2:file:${user.home}/.consultorioAqua/db;AUTO_SERVER=TRUE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

server.port=8080

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# JWT: la app de escritorio corre 100% local (base H2 en la máquina del usuario,
# sin exponerse a internet), así que usamos una clave fija embebida para que
# funcione "out of the box" sin pedirle al usuario que configure nada.
# Si en algún momento esta base H2 se expusiera a internet, esta clave debería
# pasar a ser una variable de entorno como en dev/prod.

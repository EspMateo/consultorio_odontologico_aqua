spring.application.name=consultorio_aqua

# H2 embedded database - persists to user home directory
# File stored at: C:\Users\{user}\.consultorioAqua\db.mv.db
spring.datasource.url=jdbc:h2:file:${user.home}/.consultorioAqua/db;AUTO_SERVER=TRUE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

server.port=8080

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

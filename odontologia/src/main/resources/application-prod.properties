# Configuración específica para producción
spring.application.name=consultorio_aqua

# Configuración de base de datos para producción
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# "validate" en vez de "update": Hibernate ya NO altera el esquema real solo.
# Si agregás/cambiás un campo en una entidad, hay que aplicar ese cambio a mano
# en la base de Railway (o migrar a Flyway/Liquibase) antes de deployar,
# porque si el esquema no coincide con las entidades el backend no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Puerto del servidor
server.port=8080

# Configuración de logging para producción
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO 
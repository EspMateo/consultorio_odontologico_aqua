# Configuración especifica para desarrollo local
spring.application.name=consultorio_aqua

# Configuración de base de datos para desarrollo local
spring.datasource.url=jdbc:mysql://localhost:3306/consultorio_aqua?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=aqua123!

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Puerto del servidor
server.port=8080

# Configuración de logging para desarrollo
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG 

# Configuración de Jackson para fechas
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# JWT (autenticación) - la clave se toma de la variable de entorno JWT_SECRET
# Generar una con: openssl rand -base64 32
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000